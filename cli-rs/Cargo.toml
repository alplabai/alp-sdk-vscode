[workspace]
resolver = "2"
members = ["crates/alp-core", "crates/alp-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alplabai/alp-sdk-vscode"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4.6", features = ["derive"] }
inquire = "0.9"
anyhow = "1"
thiserror = "2"
owo-colors = "4"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
