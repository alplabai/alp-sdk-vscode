[workspace]
resolver = "2"
members = ["crates/alp-core", "crates/alp-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alplabai/alp-sdk-vscode"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json::Value keeps object insertion order (matches JS),
# so generated launch.json / diff values mirror the TypeScript CLI byte-for-byte.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
clap = { version = "4.6", features = ["derive"] }
inquire = "0.9"
# Lightweight blocking HTTP client (rustls) for `alp sdk list` (GitHub releases).
ureq = { version = "2", features = ["json"] }
anyhow = "1"
thiserror = "2"
owo-colors = "4"
# Spinners for captured network/IO commands (sdk list/install). Auto-hides on
# non-TTY; we additionally gate on --quiet/--ci/--non-interactive/JSON.
indicatif = "0.17"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
