[package]
name = "alplabai-alp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The native `alp` CLI for ALP SDK embedded projects: board.yaml validate/generate, project scaffolding, toolchain bootstrap, and west build/flash with a stable JSON envelope."

# cargo-binstall: fetch the prebuilt archive from the GitHub release instead of
# compiling. The archive layout matches release-cli-rs.yml (tag `cli-rs-v<ver>`,
# `alp-<target>.tar.gz`, binary at the root). Unlisted targets fall back to a
# from-source `cargo install`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/cli-rs-v{ version }/alp-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[[bin]]
name = "alp"
path = "src/main.rs"

[dependencies]
# Renamed crate (alplabai- prefix; crates.io has no @scope), imported as
# `alp_core` via the dependency key. path for local builds; version lets
# crates.io resolve it. Keep the version in lockstep with the workspace.
alp-core = { package = "alplabai-alp-core", path = "../alp-core", version = "0.1.5" }
clap.workspace = true
inquire.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
anyhow.workspace = true
owo-colors.workspace = true
indicatif.workspace = true
