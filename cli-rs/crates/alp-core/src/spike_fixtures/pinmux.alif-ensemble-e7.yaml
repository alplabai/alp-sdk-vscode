# Per-silicon PIN-MUX CAPABILITY table (METADATA — a silicon FACT, not a rule).
# DERIVED VERBATIM from the SDK's authoritative pinout TSVs:
#   metadata/e1m_modules/aen/from-alif.tsv     (pads the Alif SoC owns directly)
#   metadata/e1m_modules/aen/from-cc3501e.tsv  (pads the on-module CC3501E owns)
# Each E1M connector pad carries one standardized function landing on a silicon pad
# — the authoritative answer to "which pin can carry which peripheral signal". The
# rule engine validates pin configs against it; the CLI/VS Code extension drive an
# advanced pin-mux UI from it. Shared by every board on this silicon.
#
# Schema: e1m_pad -> { function, owner (alif|cc3501e), silicon_pad, peripheral }.
schema_version: 1
silicon: alif:ensemble:e7

