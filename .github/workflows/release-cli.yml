# SPDX-License-Identifier: Apache-2.0
#
# Publish the native `alp` CLI's npm shim (`cli-rs/npm-shim`, package `alp-sdk`)
# to npm. The shim is a thin package: its `postinstall.js` downloads the
# platform binary from the matching `cli-rs-v<version>` GitHub release — so cut
# + push that release tag FIRST (release-cli-rs.yml), then publish here.
#
# Triggered by a `cli-v*` tag, or manually via workflow_dispatch.
#
# Required repo secret (publish is SKIPPED, not failed, when unset):
#   NPM_TOKEN — npm automation token for the `alp-sdk` package
#               (npmjs.com → Access Tokens → Automation).

name: release-cli

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the npm shim
        required: true
        type: boolean
        default: false
      npmTag:
        description: npm dist-tag
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cli-rs/npm-shim

jobs:
  publish:
    name: publish npm shim
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Pack (smoke — confirm the shim packs with its bin + postinstall)
        run: |
          npm pack --dry-run
          node -e "const p=require('./package.json'); if(!p.bin||!p.bin.alp) throw new Error('shim missing bin.alp')"

      - name: Resolve npm tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "NPM_TAG=${{ inputs.npmTag || 'latest' }}" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=${{ inputs.npmTag }}" >> "$GITHUB_ENV"
          fi

      - name: Publish to npm
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Note when publish was skipped
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.NPM_TOKEN == '' }}
        run: echo "::warning::NPM_TOKEN not set — packed the shim but skipped npm publish. Add the NPM_TOKEN repo secret to enable it."

  verify:
    name: verify npm install
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the published shim + smoke `alp --version`
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          # postinstall pulls the binary from the cli-rs-v<version> GitHub release.
          npm install -g "${PKG}@${VERSION}"
          alp --version
