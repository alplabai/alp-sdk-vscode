# SPDX-License-Identifier: Apache-2.0
#
# Build + publish the native Rust `alp` CLI (cli-rs/). Per `cli-rs-v*` tag it:
#   1. attaches a prebuilt `alp-<target>.tar.gz` per platform to the GitHub
#      Release (the npm shim + cargo-binstall download these);
#   2. publishes the `alp-core` + `alp-cli` crates to crates.io (so
#      `cargo install alp-cli` / `cargo binstall alp-cli` work) — gated on the
#      CARGO_REGISTRY_TOKEN secret (skipped, not failed, when unset).
# Triggered by `cli-rs-v*` tags (distinct from the npm shim's `cli-v*` tags).
#
# Release flow: bump cli-rs/Cargo.toml + cli-rs/npm-shim/package.json to the same
# version, tag `cli-rs-v<version>`, push. This workflow builds the five targets
# and attaches `alp-<target>.tar.gz` to the GitHub Release for that tag.
#
# Linux targets are cross-built with cargo-zigbuild on ubuntu-latest (#37):
#   - x86_64-unknown-linux-gnu is pinned to a glibc 2.31 floor — building on the
#     raw runner links the runner's glibc (2.39 on ubuntu 24.04), which broke
#     consumers on Debian bookworm (2.36) with `GLIBC_2.39 not found`;
#   - x86_64/aarch64-unknown-linux-musl are fully static: they run on any
#     distro/libc, cover arm64 Linux (no arm runner needed), and are what
#     `cargo binstall` falls back to on hosts the gnu asset doesn't fit.
# The CLI's TLS stack is rustls/ring (no OpenSSL), so musl needs no extra deps.
#
# Note: x86_64-apple-darwin (Intel mac) is intentionally not built — GitHub's
# macos-13 Intel runners are scarce and stall the release for tens of minutes.
# Intel-mac users build from source (`cargo build --release`). To restore it,
# cross-compile on macos-14: add `{ target: x86_64-apple-darwin, os: macos-14 }`
# and pass `--target x86_64-apple-darwin` (the macOS toolchain builds both arches).

name: release-cli-rs

on:
  push:
    tags:
      - "cli-rs-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `zigbuild_target` opts a job into cargo-zigbuild; the `.2.31` suffix
          # pins the gnu build's glibc floor (output dir stays the bare triple).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            zigbuild_target: x86_64-unknown-linux-gnu.2.31
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild_target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild_target: aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cargo-zigbuild (Linux cross builds)
        if: matrix.zigbuild_target
        # Must be a pip --user install, NOT pipx: cargo-zigbuild finds zig via
        # `zig` on PATH or `python3 -m ziglang`, and pipx isolates the ziglang
        # wheel inside its venv where neither works ("Failed to find zig").
        # --break-system-packages sidesteps PEP 668 on the 24.04 runner; the
        # user site keeps ziglang importable by the system python3.
        run: |
          pip3 install --user --break-system-packages cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build (release, optimized profile)
        shell: bash
        run: |
          if [ -n "${{ matrix.zigbuild_target }}" ]; then
            cargo zigbuild --release --locked --manifest-path cli-rs/Cargo.toml --target "${{ matrix.zigbuild_target }}"
          else
            cargo build --release --locked --manifest-path cli-rs/Cargo.toml --target "${{ matrix.target }}"
          fi

      - name: Package archive
        shell: bash
        run: |
          dir="cli-rs/target/${{ matrix.target }}/release"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            binfile="alp.exe"
          else
            binfile="alp"
          fi
          tar -czf "alp-${{ matrix.target }}.tar.gz" -C "$dir" "$binfile"

      - name: Upload archive to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: alp-${{ matrix.target }}.tar.gz

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: alp-${{ matrix.target }}
          path: alp-${{ matrix.target }}.tar.gz
          retention-days: 14

  publish_crates:
    name: publish · crates.io
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish alp-core then alp-cli
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        # alp-core first; `cargo publish` waits for it to appear on the index
        # before alp-cli (which depends on it) is published.
        run: |
          cargo publish --package alp-core --manifest-path cli-rs/Cargo.toml --locked
          cargo publish --package alp-cli --manifest-path cli-rs/Cargo.toml --locked

      - name: Note when crates.io publish was skipped
        if: ${{ env.CARGO_REGISTRY_TOKEN == '' }}
        run: echo "::warning::CARGO_REGISTRY_TOKEN not set — skipped crates.io publish. The GitHub archives + npm shim still ship; cargo-binstall needs the crate published to resolve its metadata."
