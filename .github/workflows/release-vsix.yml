# SPDX-License-Identifier: Apache-2.0
#
# Build + publish the VS Code extension (.vsix) to the VS Code Marketplace and
# Open VSX. Triggered by a `v*` tag (the extension version in package.json, e.g.
# v0.3.0), or manually via workflow_dispatch.
#
# Required repo secrets (publish is SKIPPED, not failed, when a secret is unset):
#   VSCE_PAT  — Azure DevOps PAT for the `alplabai` Marketplace publisher
#               (https://dev.azure.com → User settings → Personal Access Tokens,
#                scope: Marketplace ▸ Manage). Used by `vsce publish`.
#   OVSX_PAT  — Open VSX access token (https://open-vsx.org → user → Access
#               Tokens). Used by `ovsx publish`. Optional — omit to skip Open VSX.
#
# Release flow: bump package.json `version`, ensure the targeted CLI release is
# published (the extension downloads it on demand — SUPPORTED_CLI_VERSION must
# match a published `alplabai/tan-cli` `v<version>` release), commit, then
# `git tag v<version>` + push.
#
# Pre-release vs stable follows the VS Code convention encoded in the version: an
# ODD minor (0.3.x, 0.5.x) publishes as `--pre-release` (beta channel); an EVEN
# minor (0.4.x, 1.0.x) publishes as a stable release. No flag to flip — just the
# version number.
#
# A second, additive job (`package_darwin_arm64`) packages + publishes a
# darwin-arm64-targeted VSIX with the `tan` CLI bundled at `bin/tan` (the
# extension's `bundled` resolver source, src/alpCli — see
# docs/EXTENSION_CLI_INTEGRATION.md §5, picks it up with no first-run
# download). It stages whichever asset the `alplabai/tan-cli`
# `v<SUPPORTED_CLI_VERSION>` release actually published for darwin/arm64 —
# through v0.5.0-rc4 that was a RAW `tan-aarch64-apple-darwin` binary; from the
# archive freeze (tan-cli#349) on, it is a `tan-aarch64-apple-darwin.tar.gz`
# onedir tree (the launcher plus its `_internal/` support files), because a
# PyInstaller onefile freeze re-extracted itself on every invocation. Which
# shape a given release published is resolved the same way the extension's own
# `bundled`/`download` resolver does at activation — `releaseAssetForTarget` +
# `resolvePublishedAsset` + `downloadFile` (src/alpCli/{service,download}.ts,
# invoked via `scripts/stage-tan-cli-asset.mjs`) — never a hardcoded asset name
# here, which is how the raw-name URL drifted stale once already: the archive
# migration shipped in the extension (src/alpCli) and this job's own
# hardcoded URL did not move with it. `bin/tan` therefore may have siblings on
# disk (e.g. `bin/_internal/`) for an archive release; `vsce package` below is
# passed
# `--follow-symlinks` for exactly that reason — see that step's comment. It
# reuses the same VSCE_PAT secret and SHOULD_PUBLISH gate as the universal job,
# and always publishes `--pre-release` (it's the first bundled-CLI VSIX,
# regardless of the odd/even-minor convention above). The universal
# (binary-less) job stays unchanged and independent.

name: release-vsix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Marketplace + Open VSX
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package_and_publish:
    name: package + publish vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload the .vsix asset
    # Observed outcomes for release_gate (#432) to assert against declared
    # intent. release_outcome / marketplace_outcome read the PUBLISH STEP'S
    # OWN outcome (success/failure/skipped) -- release_gate compares that
    # against SHOULD_PUBLISH/the event (the declaration) itself, so this is
    # non-circular: the outcome comes from the step's actual run, never from
    # re-deriving what the arming condition would predict. (outcome=='skipped'
    # DOES mean the arming condition was false -- that part is expected; the
    # trap this avoids is deriving the OUTCOME from the same condition that
    # armed the step, which would make the comparison circular.) ovsx_published
    # is different: Open VSX is the one OPTIONAL channel, so "declined" must be
    # distinguishable from "the wiring broke" -- that needs the self-reported
    # true/false the two Open VSX steps below write explicitly, ported from
    # alplabai/tan-cli#242's npm job.
    outputs:
      release_outcome: ${{ steps.create_release.outcome }}
      marketplace_outcome: ${{ steps.marketplace_publish.outcome }}
      ovsx_published: ${{ steps.ovsx_publish.outputs.published || steps.ovsx_skip.outputs.published }}
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Publish on a pushed tag, or a manual run with publish=true.
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile (extension + CLI bundle + webview)
        run: pnpm run compile

      - name: Gate — fetch tan's published envelope contract for the pinned version
        # Must run BEFORE the tests, exactly as in ci.yml (which carries the full
        # rationale): test/tanContract.test.js is pure and reads whatever this
        # leaves in test/golden/tan-contract/. That corpus is gitignored, so a
        # release checkout has none — and since the contract gate now FAILS on a
        # missing artefact rather than skipping, omitting this step reds the next
        # `v*` tag at "Unit / integration tests" below. `CI` is set here, so the
        # `TAN_CONTRACT_OFFLINE=1` opt-out cannot green it either.
        run: node scripts/fetch-tan-contract.mjs

      - name: Unit / integration tests
        run: node --test "test/*.test.js"

      # #443: nothing on the release path asserted that the pinned tan tag is
      # PUBLISHED. The darwin job discovers it at its download step (a 404 on
      # one asset, after the tag is already pushed); the universal job never
      # discovered it at all — it ships binary-less and every install resolves
      # `tan` by download-on-demand, so a bad pin reached users as a 404 loop on
      # activation with a fully green release run behind it.
      #
      # `check-cli-pin.mjs` is what ci.yml already runs for this, and it is a
      # stronger check than `gh release view "v${VERSION}"`: it HEADs the asset
      # for EVERY host in `TARGETS`, so a release whose Windows binary failed to
      # upload fails here too — invisible to a tag-existence check. It reads the
      # pin by IMPORTING the constant from out/alpCli/service.js, so it also
      # cannot disagree with the grep in the darwin job below. Only a 404 fails
      # it; a rate-limit or an outage reports "skipped, not a repo defect", so
      # this cannot red a release over someone else's downtime.
      - name: Gate — SUPPORTED_CLI_VERSION is a published tan-cli release
        run: node scripts/check-cli-pin.mjs

      - name: Resolve pre-release flag (VS Code convention — odd minor = pre-release)
        run: |
          MINOR=$(node -p "require('./package.json').version.split('.')[1]")
          if [ "$((MINOR % 2))" -eq 1 ]; then
            echo "PRERELEASE_FLAG=--pre-release" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "::notice::version 0.$MINOR.x → publishing as a PRE-RELEASE (odd minor)."
          else
            echo "PRERELEASE_FLAG=" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "::notice::version 0.$MINOR.x → publishing as a STABLE release (even minor)."
          fi

      - name: Package (.vsix)
        run: pnpm exec vsce package --no-dependencies $PRERELEASE_FLAG --out alp-sdk.vsix

      - name: Upload vsix artefact
        uses: actions/upload-artifact@v4
        with:
          name: alp-sdk-vsix
          path: alp-sdk.vsix
          retention-days: 30

      - name: Gate — VSIX ships only allowlisted top-level paths (#70)
        run: bash scripts/check-vsix-allowlist.sh alp-sdk.vsix

      - name: Create GitHub Release (attach the universal .vsix)
        # On a pushed tag only. Keeps the GitHub Releases page consistent with
        # tan-cli / alp-sdk (which both cut a GH Release per tag) instead of the
        # tag-only state that left v0.3.6 without a visible release.
        id: create_release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: alp-sdk.vsix
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            The `.vsix` below is attached now. Marketplace/Open VSX publish runs as
            a later step in this same workflow — check its run for status before
            assuming it landed: https://marketplace.visualstudio.com/items?itemName=AlpLabAI.alp-sdk
            Install now regardless: download `alp-sdk.vsix` below and
            `code --install-extension alp-sdk.vsix`.

      - name: Publish to VS Code Marketplace
        id: marketplace_publish
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.VSCE_PAT != '' }}
        run: pnpm exec vsce publish --no-dependencies $PRERELEASE_FLAG --packagePath alp-sdk.vsix
        # VSCE_PAT is read from the environment by vsce.

      - name: Publish to Open VSX
        id: ovsx_publish
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.OVSX_PAT != '' }}
        run: |
          npx --yes ovsx publish alp-sdk.vsix $PRERELEASE_FLAG --pat "$OVSX_PAT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Note when Marketplace publish was skipped
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.VSCE_PAT == '' }}
        run: |
          echo "::warning::VSCE_PAT not set — built the .vsix but skipped Marketplace publish. Add the VSCE_PAT repo secret to enable it."
          {
            echo "### Marketplace: NOT PUBLISHED"
            echo
            echo "VSCE_PAT repo secret is not set — built \`alp-sdk.vsix\` but skipped the VS Code Marketplace publish. Add the VSCE_PAT repo secret to enable it."
          } >> "$GITHUB_STEP_SUMMARY"

      # #432: Open VSX had no counterpart to the note above, so on v0.4.0 (where
      # OVSX_PAT is absent from this repo's secrets) the skip was silent -- a
      # green run said nothing, and Open VSX users stayed on 0.3.x with no
      # announcement. tan-cli#151 is the proof that an annotation alone is the
      # weakest signal GitHub has (a correctly-emitted skip warning on tan
      # v0.4.0 still read as a publish) -- so this writes BOTH an annotation and
      # a run-summary line, same as the Marketplace note above.
      - name: Note when Open VSX publish was skipped
        id: ovsx_skip
        # always(): all four publish-observing steps in this job run in FIXED
        # ORDER (create_release -> marketplace_publish -> ovsx_publish -> this
        # step), so without always() a marketplace_publish failure -- the #432
        # scenario itself -- aborts the job before this step is even reached.
        # Neither Open VSX step then writes `published`, ovsx_published
        # resolves to the empty string, and release_gate misreports that as
        # broken wiring instead of the real cause (the Marketplace failure).
        # always() lets this step still record "declined" independently of
        # whatever an earlier, unrelated channel did.
        if: ${{ always() && env.SHOULD_PUBLISH == 'true' && env.OVSX_PAT == '' }}
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "::notice::OVSX_PAT not set — built the .vsix but skipped the Open VSX publish. Add the OVSX_PAT repo secret to enable it (this channel is optional)."
          {
            echo "### Open VSX: NOT PUBLISHED"
            echo
            echo "OVSX_PAT repo secret is not set — built \`alp-sdk.vsix\` but skipped the Open VSX publish. Open VSX users stay on the previous version until the secret is added. This channel is optional; omitting OVSX_PAT is a supported configuration, not an error."
          } >> "$GITHUB_STEP_SUMMARY"

  # Why is darwin-arm64 the ONLY platform that bundles a binary?
  #
  # Because the asymmetry is intentional and staged, not an oversight.
  # docs/EXTENSION_CLI_INTEGRATION.md §5 states the end state — platform-specific
  # VSIXes for "`--target darwin-arm64`, and eventually the other five targets
  # `tan-cli` publishes" — with darwin-arm64 as the first one shipped. That
  # "five" is stale, and so was the "eight" this comment used to cite (from
  # tan-cli v0.3.1, a Rust release): `TARGETS` (src/alpCli/service.ts) maps
  # SIX platform/arch combos, so six is the ceiling for jobs to add, one
  # shipped, FIVE to go — but the release actually pinned, not the ceiling, is
  # what decides whether a job has an asset to bundle. A Python `tan` release
  # (v0.5.0 on, a PyInstaller freeze that cannot cross-compile) publishes an
  # asset for only FOUR targets (x86_64 × pc-windows-msvc/apple-darwin, aarch64
  # × apple-darwin, and Linux x64 as unknown-linux-gnu only — no musl, no arm64
  # Linux or Windows), declared in `HOSTS_WITHOUT_RELEASE_ASSET`. Whether that
  # asset is a raw binary or a `.zip`/`.tar.gz` archive is a separate axis (see
  # the header comment above) and does not change which FOUR hosts are covered.
  # A job added
  # for one of those two undeclared hosts would have nothing to bundle against
  # the current pin. (Correcting the doc is a separate change — not this one.)
  #
  # Until then, every Windows, Linux and darwin-x64 install ships binary-less and
  # acquires `tan` through the universal VSIX's normal resolver chain
  # (`resolveAlpBinary()`, src/alpCli): the `alpSdk.cliPath` setting → bundled
  # (absent there) → a locally built sibling tan-cli → a previously cached
  # download → a verified-native `tan` on PATH → download-on-demand of
  # `tan-<triple>[.exe]` from the pinned tan-cli release, provisioned up front on
  # activation. That path works; what it costs is a first-run network call, which
  # is exactly what offline/proxied users cannot pay (§5 "Reversal rationale").
  #
  # One branch of `decideBinarySource()` (src/alpCli/service.ts) is elided above:
  # with `alpSdk.preferGlobalCli` on, a verified-native `tan` on PATH is checked
  # SECOND — after `alpSdk.cliPath`, but AHEAD of bundled. It defaults to false
  # (package.json), so the chain above is what an unconfigured install follows.
  # With it on, a darwin-arm64 install runs the PATH `tan` and never touches the
  # binary this job goes to the trouble of bundling.
  #
  # Deliberately NOT expanding the matrix here — that is a separate decision with
  # its own cost (7 more package+publish jobs, 7 more Marketplace targets to keep
  # in lockstep with the pin, and a per-target verification story this workflow
  # does not have today).
  package_darwin_arm64:
    name: package + publish vsix (darwin-arm64, bundled CLI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # See package_and_publish's outputs: comment above -- same reasoning, this
    # channel is declared "always" (always --pre-release) so its own step
    # outcome is a safe, non-circular signal for release_gate (#432).
    outputs:
      marketplace_outcome: ${{ steps.marketplace_publish.outcome }}
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # Publish on a pushed tag, or a manual run with publish=true (same gate
      # as the universal job).
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile (extension + CLI bundle + webview)
        run: pnpm run compile

      - name: Gate — fetch tan's published envelope contract for the pinned version
        # Same step, same reason, as the universal job above and ci.yml — this
        # job runs the same test command and would red on the same missing
        # corpus.
        run: node scripts/fetch-tan-contract.mjs

      - name: Unit / integration tests
        run: node --test "test/*.test.js"

      - name: Resolve pinned CLI version (mirrors SUPPORTED_CLI_VERSION in src/alpCli/service.ts)
        id: cli_version
        # The `(-[0-9A-Za-z.-]+)?` suffix is not decoration: without it a
        # PRERELEASE pin (tan publishes them — `v0.4.0-rc1` exists) resolves to
        # the empty string and this job dies at the `::error::` below — at
        # RELEASE time, on a tag already pushed, since nothing type-checks the
        # constant (#443). BOTH greps carry it, and that is the part worth
        # reading twice: widening only the first leaves the second extracting
        # `0.5.0` out of `0.5.0-rc1`, which would bundle a DIFFERENT tan than
        # the pin names instead of failing. Whether the pattern still resolves a
        # prerelease is asserted by test/cliPin.prerelease.test.js, which reads
        # this line out of this file.
        run: |
          VERSION=$(grep -oE 'SUPPORTED_CLI_VERSION = "[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?"' src/alpCli/service.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve SUPPORTED_CLI_VERSION from src/alpCli/service.ts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Bundling tan CLI v$VERSION (aarch64-apple-darwin)"

      - name: Download + stage the aarch64-apple-darwin tan binary
        # Fatal on purpose: this job exists ONLY to ship the bundled binary. A
        # darwin-arm64 VSIX without bin/tan is the universal VSIX wearing a
        # platform label, and VS Code PREFERS a platform-specific VSIX over the
        # universal one — publishing an empty one is strictly worse than
        # publishing none. No `|| true`, no exit-code special-casing: any
        # non-zero exit from the script below fails this step, including its
        # own "no asset published for this host" outcome (exit 2) — unlike
        # ci.yml's smoke test, this job may NOT treat that as a loud skip.
        #
        # The resolution + download + checksum-verify + (if archived) unpack
        # is NOT hand-rolled here — see scripts/stage-tan-cli-asset.mjs's own
        # header for why: it calls the exact same
        # `releaseAssetForTarget`/`resolvePublishedAsset`/`downloadFile`
        # (src/alpCli/{service,download}.ts) the extension's own `bundled`/
        # `download` resolver runs at activation, compiled by the `Compile`
        # step above into out/alpCli/*.js. That is what keeps this job from
        # ever again requesting an asset name `scripts/check-cli-pin.mjs`
        # didn't already verify resolves for the pinned release.
        run: |
          node scripts/stage-tan-cli-asset.mjs \
            --platform darwin --arch arm64 --dest bin \
            --version "${{ steps.cli_version.outputs.version }}"

      - name: Package (.vsix, darwin-arm64, bundled CLI)
        # --follow-symlinks is REQUIRED, not a style preference, once bin/ can
        # hold an archive-installed onedir tree: a PyInstaller macOS freeze's
        # `_internal/` carries real symlinks (e.g.
        # `Python.framework/Versions/Current -> 3.12`), and without this flag
        # `vsce package`'s secret scan tries to `read()` a directory symlink as
        # a file and dies with `EISDIR`, packaging NOTHING and producing no
        # .vsix — measured locally against the real v0.5.1 darwin-arm64
        # archive. `--follow-symlinks` makes vsce recurse into (and thereby
        # materialise) those entries instead of choking on them; it has no
        # effect when bin/ holds a single raw binary (no symlinks to find), so
        # it is safe to pass unconditionally for either shape.
        run: pnpm exec vsce package --no-dependencies --target darwin-arm64 --pre-release --follow-symlinks --out alp-sdk-darwin-arm64.vsix

      - name: Upload vsix artefact
        uses: actions/upload-artifact@v4
        with:
          name: alp-sdk-vsix-darwin-arm64
          path: alp-sdk-darwin-arm64.vsix
          retention-days: 30

      - name: Gate — VSIX ships only allowlisted top-level paths (#70)
        run: bash scripts/check-vsix-allowlist.sh alp-sdk-darwin-arm64.vsix

      - name: Publish to VS Code Marketplace
        id: marketplace_publish
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.VSCE_PAT != '' }}
        # NB: --target must NOT be passed with --packagePath — the target is
        # already baked into the packaged .vsix by the earlier
        # "Package (.vsix, darwin-arm64, bundled CLI)" step's
        # `vsce package --target darwin-arm64`; vsce rejects both together
        # ("Both options not supported simultaneously: 'packagePath' and
        # 'target'"). Publish the pre-built platform .vsix by path only.
        run: pnpm exec vsce publish --no-dependencies --pre-release --packagePath alp-sdk-darwin-arm64.vsix
        # VSCE_PAT is read from the environment by vsce.

      - name: Note when Marketplace publish was skipped
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.VSCE_PAT == '' }}
        run: |
          echo "::warning::VSCE_PAT not set — built the darwin-arm64 .vsix but skipped Marketplace publish. Add the VSCE_PAT repo secret to enable it."
          {
            echo "### Marketplace (darwin-arm64): NOT PUBLISHED"
            echo
            echo "VSCE_PAT repo secret is not set — built \`alp-sdk-darwin-arm64.vsix\` but skipped the VS Code Marketplace publish. Add the VSCE_PAT repo secret to enable it."
          } >> "$GITHUB_STEP_SUMMARY"

  # #432: a real v0.4.0 run created a GitHub Release (step 13) and then failed
  # to publish to the Marketplace (step 14, a gallery request timeout) — the
  # run was red, but the Releases page looked complete, and nothing forced a
  # second look at the Marketplace. Reordering the steps only inverts which
  # side would get orphaned by the next failure; what was missing is an
  # assertion, ported from alplabai/tan-cli#242 (`ci/release-outcome-gate`).
  #
  # Declaration-relative, no exemption list -- but the declaration is NOT "a
  # pushed tag": this workflow also runs on workflow_dispatch, which can be
  # run from a branch (no ref-based restriction would then even see this job)
  # or from a tag with publish=false (a legitimate build-only dry run). So
  # each leg's declaration is read from what actually arms it:
  #
  #   | leg                         | declared by                              |
  #   |------------------------------|-------------------------------------------|
  #   | GitHub Release               | github.event_name == 'push' only (that's |
  #   |                              | create_release's own `if:` -- a dispatch |
  #   |                              | never creates one, by design)            |
  #   | Marketplace (universal)      | SHOULD_PUBLISH (push, or dispatch with   |
  #   |                              | publish=true)                            |
  #   | Marketplace (darwin-arm64)   | same SHOULD_PUBLISH, always --pre-release|
  #   | Open VSX                     | optional -- only asserted at all when    |
  #   |                              | SHOULD_PUBLISH=true (OVSX_PAT documented |
  #   |                              | optional at the top of this file)        |
  #
  # A deliberately disarmed channel (Open VSX with no OVSX_PAT, or the whole
  # publish leg on a publish=false dry run) SATISFIES the invariant rather
  # than being excused from it: the assertion below checks the declaration
  # AGAINST the outcome, not "was this declared" alone.
  release_gate:
    name: release outcome matches intent
    needs: [package_and_publish, package_darwin_arm64]
    # !cancelled(), not always(): always() also fires on a deliberately
    # cancelled run (this workflow sets concurrency: cancel-in-progress:
    # true), which would otherwise red the gate over a cancellation instead of
    # a real outcome mismatch. No ref/event restriction here -- see the table
    # above; the job runs on every trigger this workflow has, and the SCRIPT
    # decides what each trigger actually declared.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: assert the release and every channel matched its declared intent
        shell: bash
        env:
          # Declarations, read directly from the event/inputs -- exactly what
          # create_release's and the publish steps' own `if:` conditions read,
          # so "declared" here can never disagree with what actually armed
          # them. This is reading the DECLARATION, not the outcome -- the
          # circularity trap is deriving the OUTCOME this way, which is why
          # every *_OUTCOME/*_PUBLISHED below instead comes from the step
          # itself (steps.<id>.outcome / a self-reported job output).
          RELEASE_DECLARED: ${{ github.event_name == 'push' }}
          SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
          RELEASE_OUTCOME: ${{ needs.package_and_publish.outputs.release_outcome }}
          MARKETPLACE_OUTCOME: ${{ needs.package_and_publish.outputs.marketplace_outcome }}
          DARWIN_MARKETPLACE_OUTCOME: ${{ needs.package_darwin_arm64.outputs.marketplace_outcome }}
          OVSX_PUBLISHED: ${{ needs.package_and_publish.outputs.ovsx_published }}
        run: |
          set -euo pipefail
          fail=0
          note() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          bad() { echo "::error::$1"; note "- FAIL: $1"; fail=1; }

          note "### Release outcome vs declared intent"
          note ""
          note "| leg | declared | outcome |"
          note "|---|---|---|"
          note "| GitHub Release | push-only, declared=${RELEASE_DECLARED} | \`${RELEASE_OUTCOME:-<empty>}\` |"
          note "| Marketplace (universal) | SHOULD_PUBLISH=${SHOULD_PUBLISH} | \`${MARKETPLACE_OUTCOME:-<empty>}\` |"
          note "| Marketplace (darwin-arm64) | SHOULD_PUBLISH=${SHOULD_PUBLISH}, --pre-release | \`${DARWIN_MARKETPLACE_OUTCOME:-<empty>}\` |"
          note "| Open VSX | optional when SHOULD_PUBLISH=true | published=\`${OVSX_PUBLISHED:-<none>}\` |"
          note ""

          # 1. GitHub Release -- only declared on a pushed tag. A
          # workflow_dispatch run (any ref, any publish= value) never attempts
          # one at all, so there is nothing to assert there; a tag with no
          # Release behind it is the #432 state.
          if [ "$RELEASE_DECLARED" = "true" ] && [ "$RELEASE_OUTCOME" != "success" ]; then
            bad "no GitHub Release was published for ${GITHUB_REF_NAME} (outcome: ${RELEASE_OUTCOME:-<empty>}). A pushed tag must always produce a Release with its assets; the tag is now spent with nothing behind it."
          fi

          # 2/3. Marketplace, both jobs -- declared by SHOULD_PUBLISH, never by
          # the ref alone (a workflow_dispatch tag with publish=false is a
          # legitimate no-publish dry run; a workflow_dispatch BRANCH with
          # publish=true still must publish, since SHOULD_PUBLISH says so).
          check_marketplace() {
            local label="$1" outcome="$2"
            if [ "$SHOULD_PUBLISH" = "true" ]; then
              if [ "$outcome" != "success" ]; then
                bad "$label did not publish to the VS Code Marketplace for ${GITHUB_REF_NAME} (outcome: ${outcome:-<empty>}). SHOULD_PUBLISH=true declares this channel must publish."
              fi
            elif [ "$outcome" != "skipped" ]; then
              bad "$label reported outcome '${outcome:-<empty>}' with SHOULD_PUBLISH=false. A non-publishing run must leave this channel cleanly skipped, not ${outcome:-<empty>}."
            fi
          }
          check_marketplace "the universal .vsix" "$MARKETPLACE_OUTCOME"
          check_marketplace "the darwin-arm64 .vsix" "$DARWIN_MARKETPLACE_OUTCOME"

          # 4. Open VSX is the one OPTIONAL channel, and it only gets asserted
          # at all when a publish was actually declared -- on a non-publishing
          # run neither of its two steps even attempts to run (both require
          # SHOULD_PUBLISH=true), so `ovsx_published` legitimately resolves
          # empty there and that is NOT a wiring failure.
          #
          # When SHOULD_PUBLISH=true, `published` must be exactly 'true' or
          # 'false' -- anything else means the outputs wiring between
          # package_and_publish and this gate is broken, and the comparison
          # would be against nothing rather than a real observation. This is
          # the hole a re-derived value would hide: an unresolvable
          # needs.package_and_publish.outputs.ovsx_published (a renamed step
          # id, a removed outputs: entry, a context GitHub never populates)
          # evaluates to the EMPTY STRING with no error, and empty satisfies
          # `!= 'true'` -- which reads as "correctly declined" even though
          # nothing ran the comparison at all. So this is checked explicitly,
          # naming the wiring as the cause rather than blaming the channel.
          if [ "$SHOULD_PUBLISH" = "true" ] && [ "$OVSX_PUBLISHED" != "true" ] && [ "$OVSX_PUBLISHED" != "false" ]; then
            bad "the package_and_publish job reported ovsx_published='${OVSX_PUBLISHED:-<empty>}', which is neither true nor false. The outputs wiring for Open VSX is broken, so its declaration cannot be checked. Check the ovsx_publish/ovsx_skip step ids and the job's outputs: block."
          fi
          # No further Open VSX check: true (published) and false (declined via
          # a missing OVSX_PAT) BOTH satisfy the invariant, because the channel
          # is declared optional. Only a non-boolean value fails it.

          if [ "$fail" -ne 0 ]; then
            note ""
            note "This tag did NOT ship as declared. See the annotations above."
            exit 1
          fi
          note "All legs matched their declared intent."
          echo "release + every channel matched its declared intent."
