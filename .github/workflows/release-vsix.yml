# SPDX-License-Identifier: Apache-2.0
#
# Build + publish the VS Code extension (.vsix) to the VS Code Marketplace and
# Open VSX. Triggered by a `v*` tag (the extension version in package.json, e.g.
# v0.3.0), or manually via workflow_dispatch.
#
# Required repo secrets (publish is SKIPPED, not failed, when a secret is unset):
#   VSCE_PAT  — Azure DevOps PAT for the `alplabai` Marketplace publisher
#               (https://dev.azure.com → User settings → Personal Access Tokens,
#                scope: Marketplace ▸ Manage). Used by `vsce publish`.
#   OVSX_PAT  — Open VSX access token (https://open-vsx.org → user → Access
#               Tokens). Used by `ovsx publish`. Optional — omit to skip Open VSX.
#
# Release flow: bump package.json `version`, ensure the targeted CLI release is
# published (the extension downloads it on demand — SUPPORTED_CLI_VERSION must
# match a published `alplabai/tan-cli` `v<version>` release), commit, then
# `git tag v<version>` + push.
#
# Pre-release vs stable follows the VS Code convention encoded in the version: an
# ODD minor (0.3.x, 0.5.x) publishes as `--pre-release` (beta channel); an EVEN
# minor (0.4.x, 1.0.x) publishes as a stable release. No flag to flip — just the
# version number.
#
# A second, additive job (`package_darwin_arm64`) packages + publishes a
# darwin-arm64-targeted VSIX with the `tan` CLI bundled at `bin/tan` (the
# extension's `bundled` resolver source, src/alpCli — see
# docs/EXTENSION_CLI_INTEGRATION.md §5, picks it up with no first-run
# download). It downloads the prebuilt RAW `tan-aarch64-apple-darwin` binary
# from the `alplabai/tan-cli` `v<SUPPORTED_CLI_VERSION>` release
# (src/alpCli/service.ts is the source of truth for the version), reuses the
# same VSCE_PAT secret and SHOULD_PUBLISH gate as the universal job, and always
# publishes `--pre-release` (it's the first bundled-CLI VSIX, regardless of the
# odd/even-minor convention above). The universal (binary-less) job stays
# unchanged and independent.

name: release-vsix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Marketplace + Open VSX
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package_and_publish:
    name: package + publish vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload the .vsix asset
    # Observed outcomes for release_gate (#432) to assert against declared
    # intent. release_outcome / marketplace_outcome read the PUBLISH STEP'S
    # OWN outcome (success/failure/skipped) -- both legs are declared "always"
    # (see release_gate below), so that alone is a safe, non-circular signal:
    # it answers "did the step actually run and succeed", never "was the
    # arming condition true". ovsx_published is different: Open VSX is the one
    # OPTIONAL channel, so "skipped" must be distinguishable from "the wiring
    # broke" -- that needs the self-reported true/false the two Open VSX steps
    # below write explicitly, ported from alplabai/tan-cli#242's npm job.
    outputs:
      release_outcome: ${{ steps.create_release.outcome }}
      marketplace_outcome: ${{ steps.marketplace_publish.outcome }}
      ovsx_published: ${{ steps.ovsx_publish.outputs.published || steps.ovsx_skip.outputs.published }}
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Publish on a pushed tag, or a manual run with publish=true.
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile (extension + CLI bundle + webview)
        run: pnpm run compile

      - name: Gate — fetch tan's published envelope contract for the pinned version
        # Must run BEFORE the tests, exactly as in ci.yml (which carries the full
        # rationale): test/tanContract.test.js is pure and reads whatever this
        # leaves in test/golden/tan-contract/. That corpus is gitignored, so a
        # release checkout has none — and since the contract gate now FAILS on a
        # missing artefact rather than skipping, omitting this step reds the next
        # `v*` tag at "Unit / integration tests" below. `CI` is set here, so the
        # `TAN_CONTRACT_OFFLINE=1` opt-out cannot green it either.
        run: node scripts/fetch-tan-contract.mjs

      - name: Unit / integration tests
        run: node --test "test/*.test.js"

      - name: Resolve pre-release flag (VS Code convention — odd minor = pre-release)
        run: |
          MINOR=$(node -p "require('./package.json').version.split('.')[1]")
          if [ "$((MINOR % 2))" -eq 1 ]; then
            echo "PRERELEASE_FLAG=--pre-release" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "::notice::version 0.$MINOR.x → publishing as a PRE-RELEASE (odd minor)."
          else
            echo "PRERELEASE_FLAG=" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "::notice::version 0.$MINOR.x → publishing as a STABLE release (even minor)."
          fi

      - name: Package (.vsix)
        run: pnpm exec vsce package --no-dependencies $PRERELEASE_FLAG --out alp-sdk.vsix

      - name: Upload vsix artefact
        uses: actions/upload-artifact@v4
        with:
          name: alp-sdk-vsix
          path: alp-sdk.vsix
          retention-days: 30

      - name: Gate — VSIX ships only allowlisted top-level paths (#70)
        run: bash scripts/check-vsix-allowlist.sh alp-sdk.vsix

      - name: Create GitHub Release (attach the universal .vsix)
        # On a pushed tag only. Keeps the GitHub Releases page consistent with
        # tan-cli / alp-sdk (which both cut a GH Release per tag) instead of the
        # tag-only state that left v0.3.6 without a visible release.
        id: create_release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: alp-sdk.vsix
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            The `.vsix` below is attached now. Marketplace/Open VSX publish runs as
            a later step in this same workflow — check its run for status before
            assuming it landed: https://marketplace.visualstudio.com/items?itemName=AlpLabAI.alp-sdk
            Install now regardless: download `alp-sdk.vsix` below and
            `code --install-extension alp-sdk.vsix`.

      - name: Publish to VS Code Marketplace
        id: marketplace_publish
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.VSCE_PAT != '' }}
        run: pnpm exec vsce publish --no-dependencies $PRERELEASE_FLAG --packagePath alp-sdk.vsix
        # VSCE_PAT is read from the environment by vsce.

      - name: Publish to Open VSX
        id: ovsx_publish
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.OVSX_PAT != '' }}
        run: |
          npx --yes ovsx publish alp-sdk.vsix $PRERELEASE_FLAG --pat "$OVSX_PAT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Note when Marketplace publish was skipped
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.VSCE_PAT == '' }}
        run: |
          echo "::warning::VSCE_PAT not set — built the .vsix but skipped Marketplace publish. Add the VSCE_PAT repo secret to enable it."
          {
            echo "### Marketplace: NOT PUBLISHED"
            echo
            echo "VSCE_PAT repo secret is not set — built \`alp-sdk.vsix\` but skipped the VS Code Marketplace publish. Add the VSCE_PAT repo secret to enable it."
          } >> "$GITHUB_STEP_SUMMARY"

      # #432: Open VSX had no counterpart to the note above, so on v0.4.0 (where
      # OVSX_PAT is absent from this repo's secrets) the skip was silent -- a
      # green run said nothing, and Open VSX users stayed on 0.3.x with no
      # announcement. tan-cli#151 is the proof that an annotation alone is the
      # weakest signal GitHub has (a correctly-emitted skip warning on tan
      # v0.4.0 still read as a publish) -- so this writes BOTH an annotation and
      # a run-summary line, same as the Marketplace note above.
      - name: Note when Open VSX publish was skipped
        id: ovsx_skip
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.OVSX_PAT == '' }}
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "::notice::OVSX_PAT not set — built the .vsix but skipped the Open VSX publish. Add the OVSX_PAT repo secret to enable it (this channel is optional)."
          {
            echo "### Open VSX: NOT PUBLISHED"
            echo
            echo "OVSX_PAT repo secret is not set — built \`alp-sdk.vsix\` but skipped the Open VSX publish. Open VSX users stay on the previous version until the secret is added. This channel is optional; omitting OVSX_PAT is a supported configuration, not an error."
          } >> "$GITHUB_STEP_SUMMARY"

  # Why is darwin-arm64 the ONLY platform that bundles a binary?
  #
  # Because the asymmetry is intentional and staged, not an oversight.
  # docs/EXTENSION_CLI_INTEGRATION.md §5 states the end state — platform-specific
  # VSIXes for "`--target darwin-arm64`, and eventually the other five targets
  # `tan-cli` publishes" — with darwin-arm64 as the first one shipped. That
  # "five" is stale; the release is what counts, and tan-cli v0.3.1 publishes
  # EIGHT raw target binaries (aarch64/x86_64 × apple-darwin, pc-windows-msvc,
  # unknown-linux-gnu, unknown-linux-musl) alongside checksums.txt. Eight is the
  # authoritative number throughout this comment: one shipped, SEVEN to go.
  # Expanding this is a matter of adding jobs, not of missing assets. (Correcting
  # the doc is a separate change — not this one.)
  #
  # Until then, every Windows, Linux and darwin-x64 install ships binary-less and
  # acquires `tan` through the universal VSIX's normal resolver chain
  # (`resolveAlpBinary()`, src/alpCli): the `alpSdk.cliPath` setting → bundled
  # (absent there) → a locally built sibling tan-cli → a previously cached
  # download → a verified-native `tan` on PATH → download-on-demand of
  # `tan-<triple>[.exe]` from the pinned tan-cli release, provisioned up front on
  # activation. That path works; what it costs is a first-run network call, which
  # is exactly what offline/proxied users cannot pay (§5 "Reversal rationale").
  #
  # One branch of `decideBinarySource()` (src/alpCli/service.ts) is elided above:
  # with `alpSdk.preferGlobalCli` on, a verified-native `tan` on PATH is checked
  # SECOND — after `alpSdk.cliPath`, but AHEAD of bundled. It defaults to false
  # (package.json), so the chain above is what an unconfigured install follows.
  # With it on, a darwin-arm64 install runs the PATH `tan` and never touches the
  # binary this job goes to the trouble of bundling.
  #
  # Deliberately NOT expanding the matrix here — that is a separate decision with
  # its own cost (7 more package+publish jobs, 7 more Marketplace targets to keep
  # in lockstep with the pin, and a per-target verification story this workflow
  # does not have today).
  package_darwin_arm64:
    name: package + publish vsix (darwin-arm64, bundled CLI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # See package_and_publish's outputs: comment above -- same reasoning, this
    # channel is declared "always" (always --pre-release) so its own step
    # outcome is a safe, non-circular signal for release_gate (#432).
    outputs:
      marketplace_outcome: ${{ steps.marketplace_publish.outcome }}
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # Publish on a pushed tag, or a manual run with publish=true (same gate
      # as the universal job).
      SHOULD_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile (extension + CLI bundle + webview)
        run: pnpm run compile

      - name: Gate — fetch tan's published envelope contract for the pinned version
        # Same step, same reason, as the universal job above and ci.yml — this
        # job runs the same test command and would red on the same missing
        # corpus.
        run: node scripts/fetch-tan-contract.mjs

      - name: Unit / integration tests
        run: node --test "test/*.test.js"

      - name: Resolve pinned CLI version (mirrors SUPPORTED_CLI_VERSION in src/alpCli/service.ts)
        id: cli_version
        run: |
          VERSION=$(grep -oE 'SUPPORTED_CLI_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' src/alpCli/service.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve SUPPORTED_CLI_VERSION from src/alpCli/service.ts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Bundling tan CLI v$VERSION (aarch64-apple-darwin)"

      - name: Download + stage the aarch64-apple-darwin tan binary
        # Fatal on purpose: this job exists ONLY to ship the bundled binary. A
        # darwin-arm64 VSIX without bin/tan is the universal VSIX wearing a
        # platform label, and VS Code PREFERS a platform-specific VSIX over the
        # universal one — publishing an empty one is strictly worse than
        # publishing none. So we keep it fatal and make the failure legible:
        # `curl -f` alone exits 22 and says nothing about which pin, which URL,
        # or which status. Dropping -f and reading %{http_code} separates "the
        # tan tag isn't published" (404) from "the network/permissions broke"
        # (000/403/5xx) — different problems, different fixes. Note -f is not
        # what blocks %{http_code}: `curl -f -w '%{http_code}'` prints 404 quite
        # happily (driven). -f is dropped so curl_exit means TRANSPORT only —
        # http_status=404 curl_exit=0 reads "network fine, server said no",
        # where -f collapses every HTTP error into exit 22. The price is that
        # curl then WRITES the non-2xx body: on a 404 that is GitHub's 9-byte
        # "Not Found" at bin/tan, which -f suppressed entirely. Hence
        # `rm -f bin/tan` on every failure path — it cleans up after this step's
        # own choice, not after some older bug.
        run: |
          set -euo pipefail
          VERSION="${{ steps.cli_version.outputs.version }}"
          # tan-cli ships a RAW binary per target (not an archive) — download it
          # straight to bin/tan (the extension's `bundled` resolver source).
          URL="https://github.com/alplabai/tan-cli/releases/download/v${VERSION}/tan-aarch64-apple-darwin"
          mkdir -p bin
          CURL_RC=0
          STATUS=$(curl -sSL -w '%{http_code}' -o bin/tan "$URL") || CURL_RC=$?
          # bin/tan is absent when curl never connected — read the size only if
          # it exists, or the failed input redirect prints its own noise.
          BYTES=0
          if [ -f bin/tan ]; then BYTES=$(wc -c < bin/tan); fi
          if [ "$CURL_RC" -ne 0 ] || [ "$STATUS" != "200" ] || [ ! -s bin/tan ]; then
            rm -f bin/tan
            echo "::error::Could not stage the bundled tan CLI. pin=v${VERSION} (SUPPORTED_CLI_VERSION in src/alpCli/service.ts) url=${URL} http_status=${STATUS} curl_exit=${CURL_RC} bytes=${BYTES}"
            if [ "$STATUS" = "404" ]; then
              echo "::error::alplabai/tan-cli has no tan-aarch64-apple-darwin asset at tag v${VERSION}. The tan-cli release must be published BEFORE this extension is tagged — SUPPORTED_CLI_VERSION may only ever name an already-published tan tag. Fix: cut+publish tan-cli v${VERSION}, or repin src/alpCli/service.ts to a published version, then re-run."
            else
              echo "::error::Not a missing-tag failure (http_status=${STATUS}, curl_exit=${CURL_RC}) — treat as network, proxy, or permissions and re-run the job. http_status=000 would mean curl never completed the request; any other status is the server's answer, and a 200 here means the asset downloaded empty."
            fi
            exit 1
          fi
          chmod +x bin/tan
          echo "::notice::Staged tan v${VERSION} aarch64-apple-darwin (${BYTES} bytes) at bin/tan from ${URL}"

      - name: Package (.vsix, darwin-arm64, bundled CLI)
        run: pnpm exec vsce package --no-dependencies --target darwin-arm64 --pre-release --out alp-sdk-darwin-arm64.vsix

      - name: Upload vsix artefact
        uses: actions/upload-artifact@v4
        with:
          name: alp-sdk-vsix-darwin-arm64
          path: alp-sdk-darwin-arm64.vsix
          retention-days: 30

      - name: Gate — VSIX ships only allowlisted top-level paths (#70)
        run: bash scripts/check-vsix-allowlist.sh alp-sdk-darwin-arm64.vsix

      - name: Publish to VS Code Marketplace
        id: marketplace_publish
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.VSCE_PAT != '' }}
        # NB: --target must NOT be passed with --packagePath — the target is
        # already baked into the packaged .vsix by the earlier
        # "Package (.vsix, darwin-arm64, bundled CLI)" step's
        # `vsce package --target darwin-arm64`; vsce rejects both together
        # ("Both options not supported simultaneously: 'packagePath' and
        # 'target'"). Publish the pre-built platform .vsix by path only.
        run: pnpm exec vsce publish --no-dependencies --pre-release --packagePath alp-sdk-darwin-arm64.vsix
        # VSCE_PAT is read from the environment by vsce.

      - name: Note when Marketplace publish was skipped
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.VSCE_PAT == '' }}
        run: |
          echo "::warning::VSCE_PAT not set — built the darwin-arm64 .vsix but skipped Marketplace publish. Add the VSCE_PAT repo secret to enable it."
          {
            echo "### Marketplace (darwin-arm64): NOT PUBLISHED"
            echo
            echo "VSCE_PAT repo secret is not set — built \`alp-sdk-darwin-arm64.vsix\` but skipped the VS Code Marketplace publish. Add the VSCE_PAT repo secret to enable it."
          } >> "$GITHUB_STEP_SUMMARY"

  # #432: a real v0.4.0 run created a GitHub Release (step 13) and then failed
  # to publish to the Marketplace (step 14, a gallery request timeout) — the
  # run was red, but the Releases page looked complete, and nothing forced a
  # second look at the Marketplace. Reordering the steps only inverts which
  # side would get orphaned by the next failure; what was missing is an
  # assertion, ported from alplabai/tan-cli#242 (`ci/release-outcome-gate`).
  #
  # Declaration-relative, no exemption list: a pushed `v*` tag MUST produce a
  # GitHub Release with its assets, and every publish channel's outcome MUST
  # match what it declares. A deliberately disarmed channel SATISFIES the
  # invariant rather than being excused from it -- which is exactly Open VSX
  # here (OVSX_PAT is documented optional at the top of this file):
  #
  #   | channel                    | declared                          |
  #   |-----------------------------|-----------------------------------|
  #   | GitHub Release              | always                            |
  #   | Marketplace (universal)     | always (channel = minor parity)   |
  #   | Marketplace (darwin-arm64)  | always (always --pre-release)     |
  #   | Open VSX                    | optional (OVSX_PAT)               |
  #
  # so `skipped`/`failure` FAILS the gate for the first three, and only Open
  # VSX may legitimately report "did not publish" and still pass.
  release_gate:
    name: release outcome matches intent
    needs: [package_and_publish, package_darwin_arm64]
    # always(), or a failed/skipped upstream job skips this gate too and the
    # whole point is lost (this is the exact v0.4.1 tan-cli shape #237 fixed).
    # Tag-only: nothing else pushes a `v*` ref, but the guard makes the scope
    # explicit rather than inherited from the jobs above.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: assert the release and every channel matched its declared intent
        shell: bash
        env:
          RELEASE_OUTCOME: ${{ needs.package_and_publish.outputs.release_outcome }}
          MARKETPLACE_OUTCOME: ${{ needs.package_and_publish.outputs.marketplace_outcome }}
          DARWIN_MARKETPLACE_OUTCOME: ${{ needs.package_darwin_arm64.outputs.marketplace_outcome }}
          OVSX_PUBLISHED: ${{ needs.package_and_publish.outputs.ovsx_published }}
        run: |
          set -euo pipefail
          fail=0
          note() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          bad() { echo "::error::$1"; note "- FAIL: $1"; fail=1; }

          note "### Release outcome vs declared intent"
          note ""
          note "| leg | declared | outcome |"
          note "|---|---|---|"
          note "| GitHub Release | always | \`${RELEASE_OUTCOME}\` |"
          note "| Marketplace (universal) | always | \`${MARKETPLACE_OUTCOME}\` |"
          note "| Marketplace (darwin-arm64) | always, --pre-release | \`${DARWIN_MARKETPLACE_OUTCOME}\` |"
          note "| Open VSX | optional (OVSX_PAT) | published=\`${OVSX_PUBLISHED:-<none>}\` |"
          note ""

          # 1. Unconditional: a tag with no Release behind it is the #432 state.
          if [ "$RELEASE_OUTCOME" != "success" ]; then
            bad "no GitHub Release was published for ${GITHUB_REF_NAME} (outcome: ${RELEASE_OUTCOME}). A pushed tag must always produce a Release with its assets; the tag is now spent with nothing behind it."
          fi

          # 2. Marketplace, universal job -- always declared, channel picked by
          # minor parity, but publish-or-not is never optional.
          if [ "$MARKETPLACE_OUTCOME" != "success" ]; then
            bad "the universal .vsix did not publish to the VS Code Marketplace for ${GITHUB_REF_NAME} (outcome: ${MARKETPLACE_OUTCOME}). This channel is always declared -- skipped or failed is never acceptable for a pushed tag."
          fi

          # 3. Marketplace, darwin-arm64 job -- always declared, always
          # --pre-release, same as #2.
          if [ "$DARWIN_MARKETPLACE_OUTCOME" != "success" ]; then
            bad "the darwin-arm64 .vsix did not publish to the VS Code Marketplace for ${GITHUB_REF_NAME} (outcome: ${DARWIN_MARKETPLACE_OUTCOME}). This channel is always declared (always --pre-release) -- skipped or failed is never acceptable for a pushed tag."
          fi

          # 4. Open VSX is the one OPTIONAL channel. `published` must be exactly
          # 'true' or 'false' -- anything else means the outputs wiring between
          # package_and_publish and this gate is broken, and the checks below
          # would be comparing against nothing rather than a real observation.
          #
          # This is the hole a re-derived value would hide: an unresolvable
          # needs.package_and_publish.outputs.ovsx_published (a renamed step id,
          # a removed outputs: entry, a context GitHub never populates)
          # evaluates to the EMPTY STRING with no error, and empty satisfies
          # `!= 'true'` -- which reads as "correctly declined" even though
          # nothing ran the comparison at all. So this is checked BEFORE the
          # declaration check, not folded into it, and it names the wiring as
          # the cause rather than blaming the channel.
          if [ "$OVSX_PUBLISHED" != "true" ] && [ "$OVSX_PUBLISHED" != "false" ]; then
            bad "the package_and_publish job reported ovsx_published='${OVSX_PUBLISHED:-<empty>}', which is neither true nor false. The outputs wiring for Open VSX is broken, so its declaration cannot be checked. Check the ovsx_publish/ovsx_skip step ids and the job's outputs: block."
          fi
          # No further Open VSX check: true (published) and false (declined via
          # a missing OVSX_PAT) BOTH satisfy the invariant, because the channel
          # is declared optional. Only a non-boolean value fails it.

          if [ "$fail" -ne 0 ]; then
            note ""
            note "This tag did NOT ship as declared. See the annotations above."
            exit 1
          fi
          note "All legs matched their declared intent."
          echo "release + every channel matched its declared intent."
