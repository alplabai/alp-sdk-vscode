#
# Build the VS Code extension on every PR + push.
# Uses pnpm workspaces; compiles extension + alp-cli + alp-webview.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · extension + vsix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (prettier)
        run: pnpm run format:check

      - name: Compile (extension + CLI bundle + webview)
        run: pnpm run compile

      - name: Unit / integration tests
        run: node --test "test/*.test.js"

      - name: Package (.vsix)
        # --no-dependencies: workspace:* protocol is not resolvable by vsce;
        # the extension code is compiled to out/ and does not need bundled
        # node_modules in the artefact (vscode provides its own require path).
        run: pnpm exec vsce package --no-dependencies --out alp-sdk.vsix

      - name: Upload vsix artefact
        uses: actions/upload-artifact@v4
        with:
          name: alp-sdk-vsix
          path: alp-sdk.vsix
          retention-days: 30

      - name: Schema-sync check
        run: |
          # The vendored board schema (shipped in the VSIX) must match the
          # submodule source of truth, so board.yaml validation can't drift.
          cmp schemas/board.schema.json \
            alp-sdk-upstream/metadata/schemas/board.schema.json
          echo "vendored board.schema.json is in sync with the submodule"

  rust_cli_contract:
    name: rust cli · contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust CLI contract harness
        run: bash cli-rs/contract/run.sh
