# SPDX-License-Identifier: Apache-2.0
#
# Build the VS Code extension on every PR + push.
# Uses pnpm workspaces; compiles extension + alp-cli + alp-webview.

name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The matrix entries carry an explicit `name` because the ubuntu context
    # name is load-bearing: `dev` and `main` require the check
    # "build · extension + vsix" verbatim, with enforce_admins=true. A bare
    # matrix renames it to "build (ubuntu-latest)"; the required context would
    # then never report and every PR would block with no admin override. So the
    # ubuntu entry keeps its name byte-for-byte and Windows arrives as a new,
    # separate context.
    #
    # One step list, two OSes: the Windows job cannot drift into skipping the
    # checks it exists to run, because there is only one copy of them.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # A Windows or macOS failure must not cancel ubuntu: ubuntu is the
      # required check, the other two are advisory until they have a track
      # record. Nor may either cancel the other — they routinely surface the
      # same defect from different angles.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: build · extension + vsix
          - os: windows-latest
            name: build · windows
          # `macos-latest` is arm64, and that is the point: it is the host the
          # darwin-arm64 bundled-CLI VSIX targets. `macos-13` would be x64 and
          # would test nothing we actually ship (#416).
          - os: macos-latest
            name: build · macos

    defaults:
      run:
        # On Windows `shell: bash` is Git Bash, so both OSes run identical step
        # bodies — including check-vsix-allowlist.sh and the `test -f` block
        # below, which are shell and would not parse under the pwsh default.
        # Checkout is LF on both: .gitattributes pins `eol=lf`, overriding the
        # Windows runner's core.autocrlf=true. Versus ubuntu's previous default
        # this only adds `pipefail`; no step body here contains a pipe.
        shell: bash

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (prettier)
        run: pnpm run format:check

      - name: Compile (extension + CLI bundle + webview)
        run: pnpm run compile

      - name: Typecheck (extension + core + webview)
        # Must follow Compile: `@alp-sdk/core/*` resolves through
        # packages/alp-core/dist, which `tsc --build` produces. Its own job here
        # is packages/alp-webview — `vite build` strips types without checking
        # them, so the webview is otherwise never type-checked at all.
        run: pnpm run typecheck

      - name: Gate — fetch tan's published envelope contract for the pinned version
        # Must run BEFORE the tests, not beside the other network-touching gate
        # below: test/tanContract.test.js is pure and reads whatever this leaves
        # in test/golden/tan-contract/.
        #
        # The asset EXISTS now: every tan tag from v0.4.0-rc1 on publishes
        # `envelope-contract.json`, and `SUPPORTED_CLI_VERSION` pins v0.4.0,
        # so this step fetches and the contract tests actually assert against a
        # real artefact. This comment previously said "no tan release has been
        # tagged since, so nothing publishes it yet" — true when written, false
        # from v0.4.0 onward.
        #
        # ONE skip path survives, and it is a list, not a judgement call: a pin
        # in `RELEASES_PREDATING_CONTRACT_ASSET` (src/alpCli/service.ts) exits 0
        # with a `::warning::` and makes no request, because nothing is
        # published for those tags. For any other pin — every release from
        # v0.4.0 on — a 404, a rate-limit, an outage and a dead network all exit
        # 1. They keep different messages because they are different
        # facts, but they share one outcome: the contract was not verified, and
        # a green run that verified nothing is what this gate exists to stop.
        # The test then fails too, independently, if the artefact is not on disk.
        run: node scripts/fetch-tan-contract.mjs

      - name: Unit / integration tests
        run: node --test "test/*.test.js"

      - name: Gate — extensionDependencies resolve on the Marketplace + Open VSX
        run: node scripts/check-extension-deps.mjs

      # Runs after compile: it reads the pin from the built out/alpCli/service.js.
      - name: Gate — SUPPORTED_CLI_VERSION is a published tan-cli release
        run: node scripts/check-cli-pin.mjs

      - name: Package (.vsix)
        # --no-dependencies: workspace:* protocol is not resolvable by vsce;
        # the extension code is compiled to out/ and does not need bundled
        # node_modules in the artefact (vscode provides its own require path).
        run: pnpm exec vsce package --no-dependencies --out alp-sdk.vsix

      - name: Upload vsix artefact
        # ubuntu only: upload-artifact@v4 rejects a duplicate artifact name, and
        # the shipped package is the ubuntu one. Windows still runs `vsce
        # package` and the allowlist gate below — it just keeps the .vsix local.
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: alp-sdk-vsix
          path: alp-sdk.vsix
          retention-days: 30

      - name: Gate — VSIX ships only allowlisted top-level paths (#70)
        run: bash scripts/check-vsix-allowlist.sh alp-sdk.vsix

      - name: Vendored schema present + valid
        run: |
          # The board schema ships vendored in the VSIX (the submodule is
          # excluded from the package). Confirm it's present and valid JSON;
          # structural assertions ($id, required) live in
          # test/board.schema.vendored.test.js.
          test -f schemas/board.schema.json
          node -e "JSON.parse(require('fs').readFileSync('schemas/board.schema.json','utf8'))"
          echo "vendored board schema present + valid JSON"

      # ---- macOS only ----------------------------------------------------
      #
      # The second half of #416, and the reason the macOS leg is worth its
      # minutes beyond "one more POSIX host".
      #
      # `release-vsix.yml`'s `package_darwin_arm64` job downloads
      # `tan-aarch64-apple-darwin` into `bin/tan` and packages it — while
      # `runs-on: ubuntu-latest` (release-vsix.yml:182). Nothing anywhere has
      # ever EXECUTED that binary; an ubuntu x64 runner physically cannot. So
      # "the bundled CLI runs" has been an untested claim on every release of
      # the one VSIX variant that bundles a CLI at all.
      #
      # Scope, stated so this is not mistaken for more than it is: this does
      # NOT test the packaged VSIX. That artefact is only assembled at a
      # release tag, so asserting on the package stays a release-time
      # property. This tests the thing inside it — the pinned darwin-arm64
      # binary, executed on darwin-arm64.
      - name: Resolve the pinned tan version
        if: matrix.os == 'macos-latest'
        id: cli_version
        # The `(-[0-9A-Za-z.-]+)?` suffix is not decoration: without it a
        # PRERELEASE pin (tan publishes them — `v0.4.0-rc1` exists) resolves to
        # the empty string and this step errors out (#443). BOTH greps carry it,
        # and that is the part worth reading twice — widening only the first
        # leaves the second extracting `0.5.0` out of `0.5.0-rc1`, which is a
        # silently WRONG version rather than a loud failure. Whether the pattern
        # still resolves a prerelease is asserted by
        # test/cliPin.prerelease.test.js, which reads this line out of this file.
        run: |
          set -euo pipefail
          VERSION=$(grep -oE 'SUPPORTED_CLI_VERSION = "[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?"' src/alpCli/service.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve SUPPORTED_CLI_VERSION from src/alpCli/service.ts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: The bundled darwin-arm64 tan binary runs on darwin-arm64
        if: matrix.os == 'macos-latest'
        # Same URL shape and the same non-`-f` curl accounting as
        # release-vsix.yml:246-268, so a 404 stays distinguishable from a
        # network failure instead of collapsing into curl's exit 22.
        #
        # Deliberately NOT fatal on a missing asset, and that is the one place
        # it differs from the release job. There, no asset means the VSIX would
        # ship broken, so it must stop the release. Here the pin can
        # legitimately name a tag whose darwin asset is not published yet, and
        # reddening every PR on that would only teach people to ignore this
        # job. A published binary that does NOT run is a hard failure — that is
        # the case worth having.
        run: |
          set -uo pipefail
          VERSION="${{ steps.cli_version.outputs.version }}"
          URL="https://github.com/alplabai/tan-cli/releases/download/v${VERSION}/tan-aarch64-apple-darwin"
          mkdir -p /tmp/bundled
          CURL_RC=0
          STATUS=$(curl -sSL -w '%{http_code}' -o /tmp/bundled/tan "$URL") || CURL_RC=$?
          BYTES=0
          if [ -f /tmp/bundled/tan ]; then BYTES=$(wc -c < /tmp/bundled/tan); fi
          if [ "$STATUS" = "404" ]; then
            rm -f /tmp/bundled/tan
            echo "::warning::No tan-aarch64-apple-darwin asset at tag v${VERSION} (SUPPORTED_CLI_VERSION, src/alpCli/service.ts). Nothing to execute — not a defect in this repo. url=${URL}"
            exit 0
          fi
          if [ "$CURL_RC" -ne 0 ] || [ "$STATUS" != "200" ] || [ ! -s /tmp/bundled/tan ]; then
            rm -f /tmp/bundled/tan
            echo "::warning::Could not fetch the bundled tan binary — treat as network/proxy/outage, not a code defect. pin=v${VERSION} http_status=${STATUS} curl_exit=${CURL_RC} bytes=${BYTES} url=${URL}"
            exit 0
          fi
          chmod +x /tmp/bundled/tan
          # Published and downloaded, so from here a failure IS ours: an
          # unrunnable bundled binary is exactly what reaches a Mac customer.
          set -e
          file /tmp/bundled/tan
          OUT=$(/tmp/bundled/tan --version)
          echo "bundled tan on darwin-arm64: ${OUT}"
          case "$OUT" in
            *"$VERSION"*) ;;
            *)
              echo "::error::The bundled darwin-arm64 binary runs but reports '${OUT}', which does not contain the pinned version ${VERSION}. The VSIX would ship a CLI that disagrees with SUPPORTED_CLI_VERSION."
              exit 1
              ;;
          esac
