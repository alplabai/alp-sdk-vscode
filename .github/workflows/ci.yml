# SPDX-License-Identifier: Apache-2.0
#
# Build the VS Code extension on every PR + push.
# Uses pnpm workspaces; compiles extension + alp-cli + alp-webview.

name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · extension + vsix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (prettier)
        run: pnpm run format:check

      - name: Compile (extension + CLI bundle + webview)
        run: pnpm run compile

      - name: Unit / integration tests
        run: node --test "test/*.test.js"

      - name: Package (.vsix)
        # --no-dependencies: workspace:* protocol is not resolvable by vsce;
        # the extension code is compiled to out/ and does not need bundled
        # node_modules in the artefact (vscode provides its own require path).
        run: pnpm exec vsce package --no-dependencies --out alp-sdk.vsix

      - name: Upload vsix artefact
        uses: actions/upload-artifact@v4
        with:
          name: alp-sdk-vsix
          path: alp-sdk.vsix
          retention-days: 30

      - name: Gate — VSIX ships only allowlisted top-level paths (#70)
        run: |
          # Fail if anything outside the runtime allowlist enters the VSIX, so
          # local tooling/agent artefacts (.agents, .claude, .code-review-graph,
          # .superpowers, .scratch, AGENTS.md, ...) or stray files can never leak
          # into the Marketplace package. Top-level only, per the acceptance
          # criteria; sub-paths are governed by .vscodeignore.
          # Lowercase for a case-robust compare: vsce normalises README/LICENSE
          # (e.g. LICENSE -> LICENSE.txt) and case can differ across platforms.
          unzip -Z1 alp-sdk.vsix \
            | sed -n 's#^extension/##p' \
            | sed -E 's#/.*##' \
            | grep -v '^$' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u > vsix-top.txt
          printf '%s\n' license license.txt readme.md media out package.json packages schemas snippets \
            | sort -u > vsix-allow.txt
          unexpected="$(comm -23 vsix-top.txt vsix-allow.txt)"
          if [ -n "$unexpected" ]; then
            echo "::error::VSIX contains unexpected top-level paths (see #70):"
            echo "$unexpected"
            exit 1
          fi
          echo "VSIX top-level contents OK: $(paste -sd' ' vsix-top.txt)"

      - name: Vendored schema present + valid
        run: |
          # The board schema ships vendored in the VSIX (the submodule is
          # excluded from the package). Confirm it's present and valid JSON;
          # structural assertions ($id, required) live in
          # test/board.schema.vendored.test.js.
          test -f schemas/board.schema.json
          node -e "JSON.parse(require('fs').readFileSync('schemas/board.schema.json','utf8'))"
          echo "vendored board schema present + valid JSON"

  rust_cli_contract:
    name: rust cli · contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust CLI contract harness
        run: bash cli-rs/contract/run.sh
